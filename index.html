<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Central Control Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            --bg-overlay: rgba(9, 9, 11, 0.75);
            --sidebar-bg: rgba(24, 24, 27, 0.3);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #3b82f6; 
            --primary-glow: rgba(59, 130, 246, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text); 
            margin: 0; 
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        #homeView {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; width: 100%; padding: 20px; box-sizing: border-box;
            animation: fadeInScale 0.6s ease;
        }
        
        #dashboardView {
            display: none;
            width: 100%; min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .home-hero { text-align: center; margin-bottom: 20px; margin-top: 0; }
        .home-greeting { font-size: 32px; font-weight: 700; margin: 0 0 15px 0; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .home-widgets { 
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; 
            background: var(--card-bg); padding: 10px 25px; border-radius: 50px; 
            border: 1px solid var(--card-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }
        .home-widget-item { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .home-widget-item span { color: var(--text-muted); font-weight: 400;}
        .home-widget-divider { width: 1px; background: var(--card-border); height: 20px; }
        .home-menu-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 18px; width: 100%; max-width: 900px; 
        }
        .home-menu-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px 15px; border-radius: 16px; text-align: center; cursor: pointer;
            font-size: 15px; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .home-menu-icon { font-size: 28px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
        .home-menu-icon img { width: 100%; height: 100%; object-fit: contain; }
        
        .home-menu-card:hover {
            transform: translateY(-10px);
            background: var(--sidebar-bg);
            border-color: var(--primary-glow);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .sidebar { 
            width: 260px; height: 100vh; position: fixed; left: 0; top: 0;
            background: var(--sidebar-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 20px 15px; border-right: 1px solid var(--card-border); 
            box-shadow: var(--glass-shadow);
            box-sizing: border-box; overflow-y: auto; 
            display: flex; flex-direction: column; z-index: 90;
        }
        .home-btn {
            background: rgba(128,128,128,0.1); color: var(--text); border: 1px solid var(--card-border); 
            padding: 10px 15px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease; 
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow);}
        
        #dynamicSidebar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
        }
        /* Sidebar category buttons: restore the original clean glass-style menu. */
        .nav-link {
            appearance: none;
            -webkit-appearance: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-width: 0;
            min-height: 42px;
            gap: 12px;
            padding: 10px 14px;
            box-sizing: border-box;
            background: rgba(128, 128, 128, 0.08);
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            text-align: left;
            text-decoration: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid var(--card-border);
        }
        .nav-icon {
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            overflow: hidden;
        }
        .nav-icon img { width: 100%; height: 100%; object-fit: contain; }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text);
            border-color: rgba(255,255,255,0.18);
            transform: translateX(2px);
        }
        .nav-link.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--primary-glow);
            border-color: var(--primary);
        }
        .edit-mode-btn {
            flex: 0 0 auto;
            justify-content: center;
            margin-top: auto;
            padding: 11px 14px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
        }
        .edit-mode-btn:hover { background: var(--card-bg); color: var(--text); }
        .edit-mode-btn.active-edit { background: var(--primary); color: #ffffff; border-color: var(--primary); }
        .developer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 9px;
            margin-bottom: 2px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
        .add-menu-btn { display: none; margin-top: 10px; border: 1px dashed var(--primary); color: var(--primary); justify-content: center; background: rgba(59, 130, 246, 0.05);}
        body.editing .add-menu-btn { display: flex; }
        .main { margin-left: 260px; padding: 25px 40px 20px 40px; width: calc(100% - 260px); box-sizing: border-box; }
        
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active-section { display: block; }
        
        .section-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; flex-wrap: wrap; gap: 10px;}
        .section-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; margin: 0;}
        
        .section-actions { display: none; gap: 10px; }
        body.editing .section-actions { display: flex; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        
        .card { 
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px 20px; 
            border-radius: 14px; transition: all 0.4s ease; 
            display: flex; flex-direction: column; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0,0,0,0.4); border-color: var(--primary-glow); background: var(--sidebar-bg);}
        
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .icon-box { 
            flex: 0 0 42px; width: 42px; height: 42px; background: rgba(255,255,255,0.05); border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; font-size: 22px; 
            border: 1px solid var(--card-border);
            transition: transform 0.4s ease;
        }
        .icon-box img { width: 26px; height: 26px; object-fit: contain; }
        .card:hover .icon-box { transform: scale(1.1) rotate(5deg); background: var(--primary-glow); }
        
        .card h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); }
        .card p { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; flex-grow: 1; }
        
        .edit-controls { display: none; gap: 8px; margin-top: 15px; }
        body.editing .edit-controls { display: flex; }
        body.editing .card-link { pointer-events: none; } 
        
        .add-card-btn {
            display: none; background: var(--card-bg); border: 2px dashed var(--card-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: var(--text-muted); border-radius: 14px; padding: 20px; text-align: center;
            cursor: pointer; align-items: center; justify-content: center; font-weight: 500; transition: all 0.3s ease;
        }
        body.editing .add-card-btn { display: flex; }
        .add-card-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
        .btn-small { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; flex: 1;}
        .btn-small.delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .btn-small:hover { filter: brightness(1.2); background: rgba(255,255,255,0.2); }
        .btn-small.delete:hover { background: var(--danger); color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content { background: var(--sidebar-bg); padding: 30px; border-radius: 18px; width: 90%; max-width: 400px; box-sizing: border-box; border: 1px solid var(--card-border); box-shadow: var(--glass-shadow); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);}
        .modal-content h2 { margin-top: 0; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;}
        .input-group input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px;}
        .help-text { font-size: 11px; color: var(--text-muted); display: block; margin-top: 6px; line-height: 1.4; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; transition: all 0.2s;}
        .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--card-border); }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { filter: brightness(1.15); transform: translateY(-2px); }
        @media (max-width: 768px) {
            #dashboardView { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--card-border); }
            .main { margin-left: 0; width: 100%; padding: 15px; }
            .home-greeting { font-size: 24px; }
            .home-widgets { flex-direction: column; align-items: center; border-radius: 20px; gap: 8px; }
            .home-widget-divider { display: none; }
        }

        .status-message { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1100; padding: 10px 16px; border-radius: 10px; background: rgba(15,23,42,.94); color: #fff; font-size: 13px; box-shadow: 0 8px 25px rgba(0,0,0,.25); display: none; max-width: calc(100% - 32px); text-align: center; }
        .status-message.show { display: block; animation: fadeIn .2s ease; }
        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
        .card-link { min-width: 0; }
        .home-menu-card { color: var(--text); }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <div id="homeView">
        <div class="home-hero">
            <h1 class="home-greeting" id="dynamicGreeting">Welcome</h1>
            <div class="home-widgets">
                <div class="home-widget-item">📅 <span id="homeDate">Loading date...</span></div>
                <div class="home-widget-divider"></div>
                <div class="home-widget-item">⏰ <span id="homeTime">--:--</span></div>
                <div class="home-widget-divider"></div>
                <div class="home-widget-item">🌤️ <span id="homeWeather">Loading weather...</span></div>
            </div>
        </div>
        <div class="home-menu-grid" id="homeMenuGrid"></div>
    </div>

    <div id="dashboardView" style="display:none;">
        <aside class="sidebar" id="sidebar">
            <button class="home-btn" type="button" data-action="home">🏠 Home Menu</button>
            <div id="dynamicSidebar"></div>
            <button class="nav-link add-menu-btn" type="button" data-action="add-section">➕ Add New Menu</button>
            <button id="toggleEditBtn" class="nav-link edit-mode-btn" type="button" data-action="toggle-edit">
                <span id="editIcon">⚙️</span> <span id="editText">Enable Edit Mode</span>
            </button>
            <div class="developer-credit">Developed by Arifin Khan</div>
        </aside>
        <main class="main" id="content-container"></main>
    </div>

    <div class="modal" id="editModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 id="modalTitle">Add New Link</h2>
            <form id="linkForm">
                <input type="hidden" id="editId">
                <input type="hidden" id="editSectionId">
                <div class="input-group"><label for="linkTitle">Title</label><input type="text" id="linkTitle" maxlength="100" required></div>
                <div class="input-group"><label for="linkUrl">URL</label><input type="url" id="linkUrl" maxlength="2048" placeholder="https://example.com" required></div>
                <div class="input-group"><label for="linkDesc">Description</label><input type="text" id="linkDesc" maxlength="250" required></div>
                <div class="input-group"><label for="linkIcon">Icon / Image URL</label><input type="text" id="linkIcon" maxlength="2048" required><span class="help-text">💡 ইমোজি অথবা HTTPS image URL দিন।</span></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" data-action="close-modal" data-modal="editModal">Cancel</button>
                    <button type="submit" class="btn btn-save">Save Link</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="sectionModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="sectionModalTitle">
            <h2 id="sectionModalTitle">Add New Menu</h2>
            <form id="sectionForm">
                <input type="hidden" id="editSecId">
                <div class="input-group"><label for="sectionTitle">Menu Title</label><input type="text" id="sectionTitle" maxlength="100" required></div>
                <div class="input-group"><label for="sectionIcon">Menu Icon / Image URL</label><input type="text" id="sectionIcon" maxlength="2048" required><span class="help-text">💡 ইমোজি অথবা HTTPS image URL দিন।</span></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" data-action="close-modal" data-modal="sectionModal">Cancel</button>
                    <button type="submit" class="btn btn-save">Save Menu</button>
                </div>
            </form>
        </div>
    </div>
    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

        let dbData = JSON.parse(JSON.stringify(defaultData));
        let isEditMode = false;
        let activeSectionId = null;
        let statusTimer;
        const $ = (id) => document.getElementById(id);

        function showStatus(message, duration = 2600) {
            const box = $('statusMessage');
            box.textContent = message;
            box.classList.add('show');
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => box.classList.remove('show'), duration);
        }

        function safeText(value, fallback = '') {
            return typeof value === 'string' ? value : fallback;
        }

        function isImageUrl(value) {
            if (typeof value !== 'string') return false;
            try {
                const url = new URL(value);
                if (url.protocol !== 'https:') return false;
                // Icons8 image URLs commonly use query parameters and have no file extension.
                const knownImageHost = /(^|\.)((img\.icons8\.com)|(cdn-icons-png\.flaticon\.com)|(images\.unsplash\.com))$/i.test(url.hostname);
                const hasImageExtension = /\.(jpeg|jpg|gif|png|svg|webp|avif)$/i.test(url.pathname);
                const hasImageFormat = /(^|&)(format|fm)=(png|jpg|jpeg|webp|svg|gif)(?:&|$)/i.test(url.search.slice(1));
                return hasImageExtension || knownImageHost || hasImageFormat;
            } catch { return false; }
        }

        function createIcon(value, className) {
            const wrapper = document.createElement('div');
            wrapper.className = className;
            const iconValue = safeText(value, '📁').trim();
            if (isImageUrl(iconValue)) {
                const image = document.createElement('img');
                image.src = iconValue;
                image.alt = 'Icon';
                image.loading = 'lazy';
                image.referrerPolicy = 'no-referrer';
                image.addEventListener('error', () => { wrapper.textContent = '📁'; }, { once: true });
                wrapper.appendChild(image);
            } else {
                wrapper.textContent = iconValue || '📁';
            }
            return wrapper;
        }

        function validExternalUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === 'https:' || url.protocol === 'http:';
            } catch { return false; }
        }

        function normalizeData(data) {
            if (!Array.isArray(data)) return null;
            return data.filter(section => section && typeof section === 'object' && typeof section.id === 'string')
                .map(section => ({
                    id: section.id,
                    title: safeText(section.title, 'Untitled Menu'),
                    icon: safeText(section.icon, '📁'),
                    links: Array.isArray(section.links) ? section.links.filter(link => link && typeof link === 'object').map(link => ({
                        id: safeText(link.id, 'L' + Date.now()),
                        title: safeText(link.title, 'Untitled Link'),
                        url: safeText(link.url, 'https://example.com'),
                        desc: safeText(link.desc, ''),
                        icon: safeText(link.icon, '🔗')
                    })) : []
                }));
        }

        function renderHome() {
            const grid = $('homeMenuGrid');
            grid.replaceChildren();
            dbData.forEach(section => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'home-menu-card';
                card.dataset.action = 'open-section';
                card.dataset.sectionId = section.id;
                card.append(createIcon(section.icon, 'home-menu-icon'));
                const title = document.createElement('span');
                title.textContent = section.title;
                card.appendChild(title);
                grid.appendChild(card);
            });
        }

        function renderSidebar() {
            const sidebar = $('dynamicSidebar');
            sidebar.replaceChildren();
            dbData.forEach(section => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'nav-link' + (section.id === activeSectionId ? ' active' : '');
                item.id = 'nav-' + section.id;
                item.dataset.action = 'switch-section';
                item.dataset.sectionId = section.id;
                item.appendChild(createIcon(section.icon, 'nav-icon'));
                const label = document.createElement('span');
                label.textContent = section.title;
                item.appendChild(label);
                sidebar.appendChild(item);
            });
        }

        function makeSmallButton(label, action, sectionId, linkId, extraClass = '') {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn-small' + (extraClass ? ' ' + extraClass : '');
            button.textContent = label;
            button.dataset.action = action;
            button.dataset.sectionId = sectionId;
            if (linkId) button.dataset.linkId = linkId;
            return button;
        }

        function renderContent() {
            const container = $('content-container');
            container.replaceChildren();
            dbData.forEach(section => {
                const sectionElement = document.createElement('section');
                sectionElement.className = 'section' + (section.id === activeSectionId ? ' active-section' : '');
                sectionElement.id = 'sec-' + section.id;

                const header = document.createElement('div');
                header.className = 'section-header-box';
                const heading = document.createElement('h2');
                heading.className = 'section-title';
                heading.appendChild(createIcon(section.icon, 'nav-icon'));
                const headingText = document.createElement('span');
                headingText.textContent = section.title;
                heading.appendChild(headingText);
                header.appendChild(heading);

                const actions = document.createElement('div');
                actions.className = 'section-actions';
                actions.append(
                    makeSmallButton('✏️ Edit Menu', 'edit-section', section.id),
                    makeSmallButton('🗑️ Delete Menu', 'delete-section', section.id, null, 'delete')
                );
                header.appendChild(actions);
                sectionElement.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid';
                section.links.forEach(link => {
                    const card = document.createElement('article');
                    card.className = 'card';
                    const anchor = document.createElement('a');
                    anchor.className = 'card-link';
                    anchor.style.cssText = 'text-decoration:none;color:inherit;display:flex;flex-direction:column;height:100%;';
                    if (validExternalUrl(link.url)) {
                        anchor.href = link.url;
                        anchor.target = '_blank';
                        anchor.rel = 'noopener noreferrer';
                    } else {
                        anchor.href = '#';
                        anchor.dataset.invalidUrl = 'true';
                    }
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';
                    cardHeader.appendChild(createIcon(link.icon, 'icon-box'));
                    const title = document.createElement('h3');
                    title.textContent = link.title;
                    cardHeader.appendChild(title);
                    const description = document.createElement('p');
                    description.textContent = link.desc;
                    anchor.append(cardHeader, description);
                    card.appendChild(anchor);

                    const controls = document.createElement('div');
                    controls.className = 'edit-controls';
                    controls.append(
                        makeSmallButton('Edit', 'edit-link', section.id, link.id),
                        makeSmallButton('Delete', 'delete-link', section.id, link.id, 'delete')
                    );
                    card.appendChild(controls);
                    grid.appendChild(card);
                });
                const addCard = document.createElement('button');
                addCard.type = 'button';
                addCard.className = 'add-card-btn';
                addCard.textContent = '+ Add New Link';
                addCard.dataset.action = 'add-link';
                addCard.dataset.sectionId = section.id;
                grid.appendChild(addCard);
                sectionElement.appendChild(grid);
                container.appendChild(sectionElement);
            });
            document.body.classList.toggle('editing', isEditMode);
            $('toggleEditBtn').classList.toggle('active-edit', isEditMode);
            $('editIcon').textContent = isEditMode ? '💾' : '⚙️';
            $('editText').textContent = isEditMode ? 'Exit Edit Mode' : 'Enable Edit Mode';
        }

        function renderAll() {
            // Keep the selected category stable when Firebase sends an update.
            if (!dbData.some(section => section.id === activeSectionId)) {
                activeSectionId = dbData.length ? dbData[0].id : null;
            }
            renderHome();
            renderSidebar();
            renderContent();
        }

        function openHome() {
            $('homeView').style.display = 'flex';
            $('dashboardView').style.display = 'none';
        }

        function openDashboard(sectionId) {
            if (!dbData.some(section => section.id === sectionId)) return;
            activeSectionId = sectionId;
            $('homeView').style.display = 'none';
            $('dashboardView').style.display = 'flex';
            renderSidebar();
            renderContent();
        }

        function switchTab(sectionId) {
            if (!dbData.some(section => section.id === sectionId)) return;
            activeSectionId = sectionId;
            renderSidebar();
            renderContent();
        }

        async function saveData() {
            try {
                localStorage.setItem('centralControlHubData', JSON.stringify(dbData));
            } catch (error) {
                console.warn('Local backup could not be saved:', error);
            }
            if (!firebaseReady || !database || !firebaseSet || !firebaseRef) {
                showStatus('⚠️ Firebase is offline. Changes are saved in this browser only.', 4500);
                return;
            }
            try {
                await firebaseSet(firebaseRef(database, 'dashboardData'), dbData);
                showStatus('✅ Changes saved successfully.');
            } catch (error) {
                console.error('Firebase save failed:', error);
                showStatus('⚠️ Cloud save failed. Your browser backup is available.', 4500);
            }
        }

        function openModal(id) {
            $(id).classList.add('active');
            $(id).setAttribute('aria-hidden', 'false');
            const firstInput = $(id).querySelector('input:not([type="hidden"])');
            if (firstInput) firstInput.focus();
        }

        function closeModal(id) {
            if (!$(id)) return;
            $(id).classList.remove('active');
            $(id).setAttribute('aria-hidden', 'true');
        }

        function openAddModal(sectionId) {
            $('linkForm').reset();
            $('editId').value = '';
            $('editSectionId').value = sectionId;
            $('modalTitle').textContent = 'Add New Link';
            openModal('editModal');
        }

        function openEditModal(sectionId, linkId) {
            const section = dbData.find(item => item.id === sectionId);
            const link = section?.links.find(item => item.id === linkId);
            if (!link) return;
            $('editId').value = link.id;
            $('editSectionId').value = sectionId;
            $('linkTitle').value = link.title;
            $('linkUrl').value = link.url;
            $('linkDesc').value = link.desc;
            $('linkIcon').value = link.icon;
            $('modalTitle').textContent = 'Edit Link';
            openModal('editModal');
        }

        function openSectionModal() {
            $('sectionForm').reset();
            $('editSecId').value = '';
            $('sectionModalTitle').textContent = 'Add New Menu';
            openModal('sectionModal');
        }

        function openEditSectionModal(sectionId) {
            const section = dbData.find(item => item.id === sectionId);
            if (!section) return;
            $('editSecId').value = section.id;
            $('sectionTitle').value = section.title;
            $('sectionIcon').value = section.icon;
            $('sectionModalTitle').textContent = 'Edit Menu';
            openModal('sectionModal');
        }

        $('linkForm').addEventListener('submit', async event => {
            event.preventDefault();
            const sectionId = $('editSectionId').value;
            const linkId = $('editId').value;
            const section = dbData.find(item => item.id === sectionId);
            const url = $('linkUrl').value.trim();
            if (!section || !validExternalUrl(url)) {
                showStatus('Please enter a valid http:// or https:// URL.');
                return;
            }
            const newLink = {
                id: linkId || 'L' + Date.now(),
                title: $('linkTitle').value.trim(),
                url,
                desc: $('linkDesc').value.trim(),
                icon: $('linkIcon').value.trim()
            };
            if (linkId) {
                const index = section.links.findIndex(item => item.id === linkId);
                if (index !== -1) section.links[index] = newLink;
            } else section.links.push(newLink);
            renderAll();
            closeModal('editModal');
            await saveData();
        });

        $('sectionForm').addEventListener('submit', async event => {
            event.preventDefault();
            const sectionId = $('editSecId').value;
            const title = $('sectionTitle').value.trim();
            const icon = $('sectionIcon').value.trim();
            if (sectionId) {
                const section = dbData.find(item => item.id === sectionId);
                if (!section) return;
                section.title = title;
                section.icon = icon;
            } else {
                const newSection = { id: 'sec_' + Date.now(), title, icon, links: [] };
                dbData.push(newSection);
                activeSectionId = newSection.id;
            }
            renderAll();
            closeModal('sectionModal');
            await saveData();
        });

        document.addEventListener('click', async event => {
            const actionElement = event.target.closest('[data-action]');
            if (actionElement) {
                const { action, sectionId, linkId, modal } = actionElement.dataset;
                switch (action) {
                    case 'home': openHome(); break;
                    case 'open-section': openDashboard(sectionId); break;
                    case 'switch-section': switchTab(sectionId); break;
                    case 'toggle-edit':
                        isEditMode = !isEditMode;
                        renderContent();
                        break;
                    case 'add-section': openSectionModal(); break;
                    case 'add-link': openAddModal(sectionId); break;
                    case 'edit-link': openEditModal(sectionId, linkId); break;
                    case 'edit-section': openEditSectionModal(sectionId); break;
                    case 'close-modal': closeModal(modal); break;
                    case 'delete-link': {
                        if (!confirm('⚠️ এই link-টি delete করতে চান?')) break;
                        const section = dbData.find(item => item.id === sectionId);
                        if (!section) break;
                        section.links = section.links.filter(item => item.id !== linkId);
                        renderAll();
                        await saveData();
                        break;
                    }
                    case 'delete-section': {
                        const section = dbData.find(item => item.id === sectionId);
                        if (!section) break;
                        if (section.links.length > 0) {
                            alert('🛑 আগে এই মেনুর ভেতরের অপশনগুলো ডিলিট করুন।');
                            break;
                        }
                        if (!confirm(`⚠️ মেনু "${section.title}" ডিলিট করতে চান?`)) break;
                        dbData = dbData.filter(item => item.id !== sectionId);
                        activeSectionId = dbData[0]?.id || null;
                        renderAll();
                        if (!activeSectionId) openHome();
                        await saveData();
                        break;
                    }
                }
            }
            if (event.target.matches('.modal')) closeModal(event.target.id);
            const invalidLink = event.target.closest('a[data-invalid-url="true"]');
            if (invalidLink) {
                event.preventDefault();
                showStatus('এই link-এর URL সঠিক নয়। Edit Mode থেকে ঠিক করুন।');
            }
        });

        function updateDateTimeAndGreeting() {
            const now = new Date();
            const hour = now.getHours();
            let greeting = 'Good Evening';
            if (hour >= 5 && hour < 12) greeting = 'Good Morning';
            else if (hour >= 12 && hour < 17) greeting = 'Good Afternoon';
            $('dynamicGreeting').textContent = `${greeting}, Arifin`;
            $('homeTime').textContent = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' });
            $('homeDate').textContent = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        }

        async function fetchDhakaWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current_weather=true');
                if (!response.ok) throw new Error('Weather request failed');
                const data = await response.json();
                const weather = data.current_weather;
                if (!weather) throw new Error('Weather data unavailable');
                const code = weather.weathercode;
                let condition = 'Clear ☀️';
                if (code >= 1 && code <= 3) condition = 'Partly Cloudy ⛅';
                else if (code >= 51 && code <= 67) condition = 'Rainy 🌧️';
                else if (code >= 80 && code <= 82) condition = 'Rain Showers 🌦️';
                else if (code >= 95) condition = 'Thunderstorm ⛈️';
                $('homeWeather').textContent = `${Math.round(weather.temperature)}°C, ${condition}`;
            } catch (error) {
                $('homeWeather').textContent = 'Weather unavailable';
            }
        }

        async function initApp() {
            updateDateTimeAndGreeting();
            setInterval(updateDateTimeAndGreeting, 1000);
            fetchDhakaWeather();

            // Render immediately using saved browser data or the built-in defaults.
            try {
                const localData = localStorage.getItem('centralControlHubData');
                if (localData) {
                    const normalizedLocal = normalizeData(JSON.parse(localData));
                    if (normalizedLocal && normalizedLocal.length) dbData = normalizedLocal;
                }
            } catch (error) {
                console.warn('Could not read local dashboard backup:', error);
            }
            activeSectionId = dbData[0]?.id || null;
            renderAll();

            // Connect to Firebase after the page is already usable.
            try {
                const [appModule, databaseModule] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js')
                ]);
                const app = appModule.initializeApp(firebaseConfig);
                database = databaseModule.getDatabase(app);
                firebaseRef = databaseModule.ref;
                firebaseSet = databaseModule.set;
                firebaseOnValue = databaseModule.onValue;
                firebaseReady = true;

                const databaseRef = firebaseRef(database, 'dashboardData');
                firebaseOnValue(databaseRef, snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        const normalized = normalizeData(data);
                        if (normalized) {
                            dbData = normalized;
                            try { localStorage.setItem('centralControlHubData', JSON.stringify(dbData)); } catch (_) {}
                        } else {
                            showStatus('⚠️ Database data format is invalid.', 4500);
                            return;
                        }
                    } else {
                        // Preserve browser data when initializing an empty Firebase database.
                        firebaseSet(databaseRef, dbData).catch(error => {
                            console.error('Initial Firebase write failed:', error);
                            showStatus('⚠️ Could not initialize cloud data. Check Firebase permissions.', 5000);
                        });
                    }
                    renderAll();
                }, error => {
                    console.error('Firebase read failed:', error);
                    showStatus('⚠️ Firebase connection failed. The dashboard is running with browser data.', 5500);
                });
            } catch (error) {
                console.error('Firebase modules could not be loaded:', error);
                showStatus('⚠️ Cloud connection unavailable. Dashboard is running with browser data.', 5500);
            }
        }

        initApp();
    </script>
</body>
</html>
