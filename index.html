        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
            line-height: 1.5;
            letter-spacing: 0;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text); 
            margin: 0; 
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        button, input, textarea, select { font: inherit; }

        #homeView {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; width: 100%; padding: 20px; box-sizing: border-box;
            animation: fadeInScale 0.6s ease;
        }
        
        #dashboardView {
            display: none;
            width: 100%; min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .home-hero { text-align: center; margin-bottom: 20px; margin-top: 0; }
        .home-greeting { font-size: 32px; font-weight: 700; margin: 0 0 15px 0; letter-spacing: -0.8px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .home-widgets { 
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; 
            background: var(--card-bg); padding: 10px 25px; border-radius: 50px; 
            border: 1px solid var(--card-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }
        .home-widget-item { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .home-widget-item span { color: var(--text-muted); font-weight: 400;}
        .home-widget-divider { width: 1px; background: var(--card-border); height: 20px; }
        .home-menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 18px;
            width: 100%;
            max-width: 900px;
            margin-inline: auto;
        }
        .home-menu-card {
            flex: 1 1 180px;
            max-width: 205px;
            min-width: 0;
            min-height: 125px;
            box-sizing: border-box;
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px 15px; border-radius: 16px; text-align: center; cursor: pointer;
            font-size: 15px; font-weight: 600; line-height: 1.45; letter-spacing: -0.1px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }

        .home-menu-icon { font-size: 28px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
        .home-menu-icon img { width: 100%; height: 100%; object-fit: contain; }
        

        
        .reorder-hint {
            display: none;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);

        function showStatus(message, duration = 2600, state = '') {

            if (duration > 0) {

                }, duration);
            }
        }

        function setFormLoading(form, isLoading) {
            const button = form.querySelector('button[type="submit"]');
            if (!button) return;
            const controls = Array.from(form.elements);
            if (isLoading) {
                if (form.dataset.saving === 'true') return;
                form.dataset.saving = 'true';
                button.dataset.originalLabel = button.textContent.trim();
                controls.forEach(control => { control.disabled = true; });
                button.innerHTML = '<span class="button-spinner" aria-hidden="true"></span>Saving...';
                button.setAttribute('aria-label', 'Saving');
            } else {
                delete form.dataset.saving;
                controls.forEach(control => { control.disabled = false; });
                button.textContent = button.dataset.originalLabel || 'Save';
                button.removeAttribute('aria-label');
            }
        }

        function safeText(value, fallback = '') {
            return typeof value === 'string' ? value : fallback;
        }

        function isImageUrl(value) {
            if (typeof value !== 'string') return false;
            try {
                const url = new URL(value);
                if (url.protocol !== 'https:') return false;
                // Icons8 image URLs commonly use query parameters and have no file extension.
                const knownImageHost = /(^|\.)((img\.icons8\.com)|(cdn-icons-png\.flaticon\.com)|(images\.unsplash\.com))$/i.test(url.hostname);
                const hasImageExtension = /\.(jpeg|jpg|gif|png|svg|webp|avif)$/i.test(url.pathname);
                const hasImageFormat = /(^|&)(format|fm)=(png|jpg|jpeg|webp|svg|gif)(?:&|$)/i.test(url.search.slice(1));
                return hasImageExtension || knownImageHost || hasImageFormat;
            } catch { return false; }
        }

        function createIcon(value, className) {
            const wrapper = document.createElement('div');
            wrapper.className = className;
            const iconValue = safeText(value, '📁').trim();
            if (isImageUrl(iconValue)) {
                const image = document.createElement('img');
                wrapper.classList.add('icon-loading');
                image.alt = 'Icon';
                image.loading = 'lazy';
                image.referrerPolicy = 'no-referrer';
                image.addEventListener('load', () => wrapper.classList.remove('icon-loading'), { once: true });
                image.addEventListener('error', () => {
                    wrapper.classList.remove('icon-loading');
                    wrapper.textContent = '📁';
                }, { once: true });
                image.src = iconValue;
                wrapper.appendChild(image);
            } else {
                wrapper.textContent = iconValue || '📁';
            }
            return wrapper;
        }

        function validExternalUrl(value) {
            try {
                const url = new URL(value);
                return url.protocol === 'https:' || url.protocol === 'http:';
            } catch { return false; }
        }

        function normalizeData(data) {
            if (!Array.isArray(data)) return null;
            return data.filter(section => section && typeof section === 'object' && typeof section.id === 'string')
                .map(section => ({
                    id: section.id,
                    title: safeText(section.title, 'Untitled Menu'),
                    icon: safeText(section.icon, '📁'),
                    links: Array.isArray(section.links) ? section.links.filter(link => link && typeof link === 'object').map(link => ({
                        id: safeText(link.id, 'L' + Date.now()),
                        title: safeText(link.title, 'Untitled Link'),
                        url: safeText(link.url, 'https://example.com'),
                        desc: safeText(link.desc, ''),
                        icon: safeText(link.icon, '🔗')
                    })) : []
                }));
        }

        function switchTab(sectionId) {
            if (!dbData.some(section => section.id === sectionId)) return;
            activeSectionId = sectionId;

            // Update the selected state in place instead of destroying/rebuilding every menu button.
            // This prevents tap/hover flicker and keeps keyboard/touch focus stable.
            document.querySelectorAll('#dynamicSidebar .nav-link[data-action="switch-section"]').forEach(item => {
                const isActive = item.dataset.sectionId === sectionId;
                item.classList.toggle('active', isActive);
                if (isActive) item.setAttribute('aria-current', 'page');
                else item.removeAttribute('aria-current');
            });

            // Only toggle visibility of the already-rendered category content.
            document.querySelectorAll('#content-container .section').forEach(section => {
                section.classList.toggle('active-section', section.id === 'sec-' + sectionId);
            });
        }

        async function saveData(options = {}) {
            const { showProgressToast = true } = options;
            try {
                localStorage.setItem('centralControlHubData', JSON.stringify(dbData));
            } catch (error) {
                console.warn('Local backup could not be saved:', error);
            }
            if (!firebaseReady || !database || !firebaseSet || !firebaseRef) {
                showStatus('⚠️ Saved in this browser. Cloud sync is unavailable.', 4500);
                return;
            }
            if (showProgressToast) showStatus('Saving changes to cloud...', 0, 'loading');
            let timeoutId;
            try {
                const writeResult = firebaseSet(firebaseRef(database, 'dashboardData'), dbData).then(
                    () => ({ state: 'saved' }),
                    error => ({ state: 'failed', error })
                );
                const timeoutResult = new Promise(resolve => {
                    timeoutId = setTimeout(() => resolve({ state: 'timeout' }), 10000);
                });
                const result = await Promise.race([writeResult, timeoutResult]);
                clearTimeout(timeoutId);
                if (result.state === 'timeout') {
                    showStatus('⚠️ Cloud sync is taking longer. Your browser backup is available.', 5000, 'warning');
                } else if (result.state === 'failed') {
                    console.error('Firebase save failed:', result.error);
                    showStatus('⚠️ Cloud save failed. Your browser backup is available.', 4500, 'error');
                } else {
                    showStatus('✅ Changes saved successfully.', 2200, 'success');
                }
            } catch (error) {
                clearTimeout(timeoutId);
                console.error('Firebase save failed:', error);
                showStatus('⚠️ Cloud save failed. Your browser backup is available.', 4500, 'error');
            }
        }

        // Reorder categories and links by dragging while Edit Mode is enabled.
        let draggedItem = null;

        document.addEventListener('dragstart', event => {
            if (!isEditMode) {
                event.preventDefault();
                return;
            }
            const item = event.target.closest('[data-sortable]');
            if (!item) return;
            draggedItem = {
                type: item.dataset.sortable,
                sectionId: item.dataset.sectionId || null,
                itemId: item.dataset.linkId || item.dataset.sectionId
            };
            item.classList.add('dragging-item');
            if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', JSON.stringify(draggedItem));
            }
        });

        document.addEventListener('dragover', event => {
            if (!isEditMode || !draggedItem) return;
            const target = event.target.closest('[data-sortable]');
            if (!target || target.dataset.sortable !== draggedItem.type) return;
            if (draggedItem.type === 'link' && target.dataset.sectionId !== draggedItem.sectionId) return;
            event.preventDefault();
            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            target.classList.add('drop-target');
            if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
        });

        document.addEventListener('drop', async event => {
            if (!isEditMode || !draggedItem) return;
            const target = event.target.closest('[data-sortable]');
            if (!target || target.dataset.sortable !== draggedItem.type) return;
            if (draggedItem.type === 'link' && target.dataset.sectionId !== draggedItem.sectionId) return;
            event.preventDefault();

            const sourceId = draggedItem.itemId;
            const targetId = draggedItem.type === 'link' ? target.dataset.linkId : target.dataset.sectionId;
            if (!sourceId || !targetId || sourceId === targetId) return;

            const bounds = target.getBoundingClientRect();
            const insertAfter = draggedItem.type === 'link'
                ? event.clientY > bounds.top + bounds.height / 2
                : event.clientY > bounds.top + bounds.height / 2;

            if (draggedItem.type === 'section') {
                const from = dbData.findIndex(section => section.id === sourceId);
                const to = dbData.findIndex(section => section.id === targetId);
                if (from < 0 || to < 0) return;
                const [moved] = dbData.splice(from, 1);
                const targetIndex = dbData.findIndex(section => section.id === targetId);
                dbData.splice(targetIndex + (insertAfter ? 1 : 0), 0, moved);
            } else {
                const section = dbData.find(item => item.id === draggedItem.sectionId);
                if (!section) return;
                const from = section.links.findIndex(link => link.id === sourceId);
                if (from < 0) return;
                const [moved] = section.links.splice(from, 1);
                const targetIndex = section.links.findIndex(link => link.id === targetId);
                if (targetIndex < 0) {
                    section.links.splice(from, 0, moved);
                    return;
                }
                section.links.splice(targetIndex + (insertAfter ? 1 : 0), 0, moved);
            }

            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            draggedItem = null;
            renderAll();
            await saveData();
        });

        document.addEventListener('dragend', () => {
            document.querySelectorAll('.dragging-item, .drop-target').forEach(el => {
                el.classList.remove('dragging-item', 'drop-target');
            });
            draggedItem = null;
        });

        $('linkForm').addEventListener('submit', async event => {
            event.preventDefault();
            const form = $('linkForm');
            if (form.dataset.saving === 'true') return;
            const sectionId = $('editSectionId').value;
            const linkId = $('editId').value;
            const section = dbData.find(item => item.id === sectionId);
            const url = $('linkUrl').value.trim();
            if (!section || !validExternalUrl(url)) {
                showStatus('Please enter a valid http:// or https:// URL.');
                return;
            }
            const newLink = {
                id: linkId || 'L' + Date.now(),
                title: $('linkTitle').value.trim(),
                url,
                desc: $('linkDesc').value.trim(),
                icon: $('linkIcon').value.trim()
            };
            if (linkId) {
                const index = section.links.findIndex(item => item.id === linkId);
                if (index !== -1) section.links[index] = newLink;
            } else section.links.push(newLink);
            renderAll();
            setFormLoading(form, true);
            try {
                await saveData({ showProgressToast: false });
            } finally {
                closeModal('editModal');
                setFormLoading(form, false);
            }
        });

        $('sectionForm').addEventListener('submit', async event => {
            event.preventDefault();
            const form = $('sectionForm');
            if (form.dataset.saving === 'true') return;
            const sectionId = $('editSecId').value;
            const title = $('sectionTitle').value.trim();
            const icon = $('sectionIcon').value.trim();
            if (sectionId) {
                const section = dbData.find(item => item.id === sectionId);
                if (!section) return;
                section.title = title;
                section.icon = icon;
            } else {
                const newSection = { id: 'sec_' + Date.now(), title, icon, links: [] };
                dbData.push(newSection);
                activeSectionId = newSection.id;
            }
            renderAll();
            setFormLoading(form, true);
            try {
                await saveData({ showProgressToast: false });
            } finally {
                closeModal('sectionModal');
                setFormLoading(form, false);
            }
        });

        document.addEventListener('click', async event => {
            const actionElement = event.target.closest('[data-action]');
            if (actionElement) {
                const { action, sectionId, linkId, modal } = actionElement.dataset;
                switch (action) {
                    case 'home': openHome(); break;
                    case 'open-section': openDashboard(sectionId); break;
                    case 'switch-section': switchTab(sectionId); break;
                    case 'toggle-edit':
                        isEditMode = !isEditMode;
                        renderAll();
                        break;
                    case 'add-section': openSectionModal(); break;
                    case 'add-link': openAddModal(sectionId); break;
                    case 'edit-link': openEditModal(sectionId, linkId); break;
                    case 'edit-section': openEditSectionModal(sectionId); break;
                    case 'close-modal': closeModal(modal); break;
                    case 'delete-link': {
                        if (!confirm('⚠️ Are you sure you want to delete this link?')) break;
                        const section = dbData.find(item => item.id === sectionId);
                        if (!section) break;
                        section.links = section.links.filter(item => item.id !== linkId);
                        renderAll();
                        await saveData();
                        break;
                    }
                    case 'delete-section': {
                        const section = dbData.find(item => item.id === sectionId);
                        if (!section) break;
                        if (section.links.length > 0) {
                            alert('🛑 Delete all links in this menu before deleting the menu.');
                            break;
                        }
                        if (!confirm(`⚠️ Are you sure you want to delete the menu "${section.title}"?`)) break;
                        dbData = dbData.filter(item => item.id !== sectionId);
                        activeSectionId = dbData[0]?.id || null;
                        renderAll();
                        if (!activeSectionId) openHome();
                        await saveData();
                        break;
                    }
                }
            }
            if (event.target.matches('.modal')) closeModal(event.target.id);
            const invalidLink = event.target.closest('a[data-invalid-url="true"]');
            if (invalidLink) {
                event.preventDefault();
                showStatus('This link URL is invalid. Please correct it in Edit Mode.');
            }
        });

        function updateDateTimeAndGreeting() {
            const now = new Date();
            const hour = now.getHours();
            // Keep the time-based greeting current until the user returns from Dashboard.
            if (!hasVisitedHome || $('homeView').style.display !== 'none') {
                const greeting = $('dynamicGreeting');
                const currentText = greeting.textContent || '';
                if (!currentText.startsWith('Welcome back')) {
                    greeting.textContent = getTimeGreeting();
                }
            }
            $('homeTime').textContent = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' });
            $('homeDate').textContent = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        }

        async function fetchDhakaWeather() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current_weather=true', { signal: controller.signal });
                if (!response.ok) throw new Error('Weather request failed');
                const data = await response.json();
                const weather = data.current_weather;
                if (!weather) throw new Error('Weather data unavailable');
                const code = weather.weathercode;
                let condition = 'Clear ☀️';
                if (code >= 1 && code <= 3) condition = 'Partly Cloudy ⛅';
                else if (code >= 51 && code <= 67) condition = 'Rainy 🌧️';
                else if (code >= 80 && code <= 82) condition = 'Rain Showers 🌦️';
                else if (code >= 95) condition = 'Thunderstorm ⛈️';
                $('homeWeather').textContent = `${Math.round(weather.temperature)}°C, ${condition}`;
            } catch (error) {
                $('homeWeather').textContent = 'Weather unavailable';
            } finally {
                clearTimeout(timeoutId);
                $('homeWeather').classList.remove('weather-loading');
            }
        }

        async function initApp() {
            updateDateTimeAndGreeting();
            setInterval(updateDateTimeAndGreeting, 1000);
            fetchDhakaWeather();

            // Render immediately using saved browser data or the built-in defaults.
            try {
                const localData = localStorage.getItem('centralControlHubData');
                if (localData) {
                    const normalizedLocal = normalizeData(JSON.parse(localData));
                    if (normalizedLocal && normalizedLocal.length) dbData = normalizedLocal;
                }
            } catch (error) {
                console.warn('Could not read local dashboard backup:', error);
            }
            activeSectionId = dbData[0]?.id || null;
            renderAll();
            setHomeGreeting(false);
            hideMainLoader();

            // Connect to Firebase after the page is already usable.
            try {
                const [appModule, databaseModule] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js')
                ]);
                const app = appModule.initializeApp(firebaseConfig);
                database = databaseModule.getDatabase(app);
                firebaseRef = databaseModule.ref;
                firebaseSet = databaseModule.set;
                firebaseOnValue = databaseModule.onValue;
                firebaseReady = true;

                const databaseRef = firebaseRef(database, 'dashboardData');
                firebaseOnValue(databaseRef, snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        const normalized = normalizeData(data);
                        if (normalized) {
                            dbData = normalized;
                            try { localStorage.setItem('centralControlHubData', JSON.stringify(dbData)); } catch (_) {}
                        } else {
                            showStatus('⚠️ Database data format is invalid.', 4500);
                            return;
                        }
                    } else {
                        // Preserve browser data when initializing an empty Firebase database.
                        firebaseSet(databaseRef, dbData).catch(error => {
                            console.error('Initial Firebase write failed:', error);
                            showStatus('⚠️ Could not initialize cloud data. Check Firebase permissions.', 5000);
                        });
                    }
                    renderAll();
                }, error => {
                    console.error('Firebase read failed:', error);
                    showStatus('⚠️ Firebase connection failed. The dashboard is running with browser data.', 5500);
                });
            } catch (error) {
                console.error('Firebase modules could not be loaded:', error);
                showStatus('⚠️ Cloud connection unavailable. Dashboard is running with browser data.', 5500);
            }
        }

        initApp();
    </script>
</body>
</html>
