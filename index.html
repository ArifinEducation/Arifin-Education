<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Control Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            --bg-overlay: rgba(9, 9, 11, 0.75);
            --sidebar-bg: rgba(24, 24, 27, 0.3);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #3b82f6; 
            --primary-glow: rgba(59, 130, 246, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body.light-mode {
            --bg-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2670&auto=format&fit=crop');
            --bg-overlay: rgba(255, 255, 255, 0.5);
            --sidebar-bg: rgba(255, 255, 255, 0.3);
            --card-bg: rgba(255, 255, 255, 0.3);
            --text: #0f172a; 
            --text-muted: #475569;
            --card-border: rgba(255, 255, 255, 0.3);
            --primary-glow: rgba(59, 130, 246, 0.25);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text); 
            margin: 0; 
            overflow-x: hidden;
            transition: all 0.4s ease;
        }

        #homeView {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; width: 100%; padding: 20px; box-sizing: border-box;
            animation: fadeInScale 0.6s ease;
        }
        
        #dashboardView {
            display: none;
            width: 100%; min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Modified Floating Controls (Moved to bottom right) */
        .floating-controls { position: fixed; bottom: 30px; right: 35px; display: flex; gap: 15px; z-index: 100;}
        .theme-btn, .color-picker-wrapper {
            width: 42px; height: 42px; border-radius: 12px; background: var(--card-bg);
            border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow); transition: all 0.3s ease;
        }
        .theme-btn:hover { transform: scale(1.1); background: var(--primary); color: white; border-color: var(--primary);}
        input[type="color"] { opacity: 0; width: 100%; height: 100%; cursor: pointer; position: absolute; }
        .color-picker-wrapper { position: relative; background: var(--primary); border-color: var(--primary); }
        .color-picker-wrapper::after { content: '🎨'; position: absolute; pointer-events: none; }

        .home-hero { text-align: center; margin-bottom: 20px; margin-top: 0; }
        .home-greeting { font-size: 32px; font-weight: 700; margin: 0 0 15px 0; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .home-widgets { 
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; 
            background: var(--card-bg); padding: 10px 25px; border-radius: 50px; 
            border: 1px solid var(--card-border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }
        .home-widget-item { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .home-widget-item span { color: var(--text-muted); font-weight: 400;}
        .home-widget-divider { width: 1px; background: var(--card-border); height: 20px; }

        .home-menu-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 18px; width: 100%; max-width: 900px; 
        }
        .home-menu-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px 15px; border-radius: 16px; text-align: center; cursor: pointer;
            font-size: 15px; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .home-menu-icon { font-size: 28px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
        .home-menu-icon img { width: 100%; height: 100%; object-fit: contain; }
        
        .home-menu-card:hover {
            transform: translateY(-10px);
            background: var(--sidebar-bg);
            border-color: var(--primary-glow);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .sidebar { 
            width: 260px; height: 100vh; position: fixed; left: 0; top: 0;
            background: var(--sidebar-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 20px 15px; border-right: 1px solid var(--card-border); 
            box-shadow: var(--glass-shadow);
            box-sizing: border-box; overflow-y: auto; 
            display: flex; flex-direction: column; z-index: 90;
        }
        .home-btn {
            background: rgba(128,128,128,0.1); color: var(--text); border: 1px solid var(--card-border); 
            padding: 10px 15px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease; 
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow);}
        
        #dynamicSidebar { display: flex; flex-direction: column; gap: 4px; }

        .nav-link { 
            display: flex; align-items: center; gap: 12px; 
            padding: 10px 14px; color: var(--text-muted); 
            text-decoration: none; border-radius: 12px; 
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.3s ease; border: 1px solid transparent;
        }
        .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .nav-icon img { width: 100%; height: 100%; object-fit: contain; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); border-color: var(--primary);}

        /* Updated Export and Edit Mode Buttons Styles */
        .export-btn { margin-top: auto; background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); }
        .export-btn:hover { background: var(--card-bg); color: var(--text); }

        .edit-mode-btn { margin-top: 8px; background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); }
        .edit-mode-btn:hover { background: var(--card-bg); color: var(--text); }
        .edit-mode-btn.active-edit { background: var(--primary); color: #ffffff; border-color: var(--primary); }

        .developer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .add-menu-btn { display: none; margin-top: 10px; border: 1px dashed var(--primary); color: var(--primary); justify-content: center; background: rgba(59, 130, 246, 0.05);}
        body.editing .add-menu-btn { display: flex; }

        .main { margin-left: 260px; padding: 25px 40px 20px 40px; width: calc(100% - 260px); box-sizing: border-box; }
        
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active-section { display: block; }
        
        .section-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; flex-wrap: wrap; gap: 10px;}
        .section-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; margin: 0;}
        
        .section-actions { display: none; gap: 10px; }
        body.editing .section-actions { display: flex; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        
        .card { 
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px 20px; 
            border-radius: 14px; transition: all 0.4s ease; 
            display: flex; flex-direction: column; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glass-shadow);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0,0,0,0.4); border-color: var(--primary-glow); background: var(--sidebar-bg);}
        
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .icon-box { 
            width: 42px; height: 42px; background: rgba(255,255,255,0.05); border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; font-size: 22px; 
            border: 1px solid var(--card-border);
            transition: transform 0.4s ease;
        }
        .icon-box img { width: 26px; height: 26px; object-fit: contain; }
        .card:hover .icon-box { transform: scale(1.1) rotate(5deg); background: var(--primary-glow); }
        
        .card h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text); }
        .card p { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; flex-grow: 1; }
        
        .edit-controls { display: none; gap: 8px; margin-top: 15px; }
        body.editing .edit-controls { display: flex; }
        body.editing .card-link { pointer-events: none; } 
        
        .add-card-btn {
            display: none; background: var(--card-bg); border: 2px dashed var(--card-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: var(--text-muted); border-radius: 14px; padding: 20px; text-align: center;
            cursor: pointer; align-items: center; justify-content: center; font-weight: 500; transition: all 0.3s ease;
        }
        body.editing .add-card-btn { display: flex; }
        .add-card-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }

        .btn-small { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; flex: 1;}
        .btn-small.delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .btn-small:hover { filter: brightness(1.2); background: rgba(255,255,255,0.2); }
        .btn-small.delete:hover { background: var(--danger); color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content { background: var(--sidebar-bg); padding: 30px; border-radius: 18px; width: 90%; max-width: 400px; box-sizing: border-box; border: 1px solid var(--card-border); box-shadow: var(--glass-shadow); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);}
        .modal-content h2 { margin-top: 0; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;}
        .input-group input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px;}
        .help-text { font-size: 11px; color: var(--text-muted); display: block; margin-top: 6px; line-height: 1.4; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; transition: all 0.2s;}
        .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--card-border); }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { filter: brightness(1.15); transform: translateY(-2px); }

        /* Responsive Styles */
        @media (max-width: 768px) {
            #dashboardView {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--card-border);
            }
            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }
            .floating-controls {
                top: auto;
                bottom: 20px;
                right: 20px;
            }
            .home-greeting {
                font-size: 24px;
            }
            .home-widgets {
                flex-direction: column;
                align-items: center;
                border-radius: 20px;
                gap: 8px;
            }
            .home-widget-divider {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="floating-controls">
        <div class="color-picker-wrapper"><input type="color" id="themeColorPicker" value="#3b82f6"></div>
        <button class="theme-btn" id="themeToggleBtn">☀️</button>
    </div>

    <div id="homeView" style="display: none;">
        <div class="home-hero">
            <h1 class="home-greeting" id="dynamicGreeting">Good Evening, Arifin</h1>
            <div class="home-widgets">
                <div class="home-widget-item">📅 <span id="homeDate">25 September 2026</span></div>
                <div class="home-widget-divider"></div>
                <div class="home-widget-item">⏰ <span id="homeTime">07:40 PM</span></div>
                <div class="home-widget-divider"></div>
                <div class="home-widget-item">🌤️ <span id="homeWeather">28°C, Clear ☀️</span></div>
            </div>
        </div>
        <div class="home-menu-grid" id="homeMenuGrid">
                <!-- Home menus will be injected here -->
        </div>
    </div>

    <div id="dashboardView" style="display: flex;">
        <div class="sidebar" id="sidebar">
            <button class="home-btn" onclick="openHome()">🏠 Home Menu</button>
            <div id="dynamicSidebar">
                <!-- Sidebar links will be injected here -->
            </div>
            
            <button class="nav-link add-menu-btn" onclick="openSectionModal()">➕ Add New Menu</button>
            
            <!-- Updated Buttons Section -->
            <button class="nav-link export-btn" onclick="exportUpdatedFile()">
                <span id="exportIcon">📥</span> Export / Save Code
            </button>
            <button id="toggleEditBtn" class="nav-link edit-mode-btn">
                <span id="editIcon">⚙️</span> <span id="editText">Enable Edit Mode</span>
            </button>
            
            <div class="developer-credit">Developed by Arifin Khan</div>
        </div>

        <div class="main" id="content-container">
            <!-- Sections will be injected here -->
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Link</h2>
            <form id="linkForm">
                <input type="hidden" id="editId">
                <input type="hidden" id="editSectionId">
                <div class="input-group"><label>Title</label><input type="text" id="linkTitle" required=""></div>
                <div class="input-group"><label>URL</label><input type="url" id="linkUrl" required=""></div>
                <div class="input-group"><label>Description</label><input type="text" id="linkDesc" required=""></div>
                <div class="input-group">
                    <label>Icon / Image URL</label>
                    <input type="text" id="linkIcon" required="">
                    <span class="help-text">💡 ইমোজি অথবা ইমেইজ লিংক দিন।</span>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal('editModal')">Cancel</button>
                    <button type="submit" class="btn btn-save">Save Link</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="sectionModal">
        <div class="modal-content">
            <h2 id="sectionModalTitle">Add New Menu</h2>
            <form id="sectionForm">
                <input type="hidden" id="editSecId">
                <div class="input-group"><label>Menu Title</label><input type="text" id="sectionTitle" required=""></div>
                <div class="input-group">
                    <label>Menu Icon / Image URL</label>
                    <input type="text" id="sectionIcon" required="">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal('sectionModal')">Cancel</button>
                    <button type="submit" class="btn btn-save">Save Menu</button>
                </div>
            </form>
        </div>
    </div>

ve-calculator.net/","desc":"Finding derivatives and rates of change step-by-step.","icon":"https://img.icons8.com/?size=100&id=-h1qLiHlUfQy&format=png&color=000000"}]},{"id":"sec_1790330202424","title":"Relax Time","icon":"https://img.icons8.com/?size=100&id=uzQgJpoW1gqx&format=png&color=000000","links":[{"id":"L1790330272103","title":"Crazy Games","url":"https://www.crazygames.com/","desc":"Browser-based games (Use a Google account to save progress).","icon":"https://img.icons8.com/?size=100&id=YObj0fzpW3Re&format=png&color=000000"},{"id":"L1790330350459","title":"Typing","url":"https://www.typing.com/student/lessons","desc":"Test your typing speed for fun (use a Google account to save progress).","icon":"https://img.icons8.com/?size=100&id=POtdOe97Ucsl&format=png&color=000000"}]}];

        let dbData = [];
        let isEditMode = false;

        function initApp() {
            const savedData = localStorage.getItem('studyDashboardData_v6');
            dbData = savedData ? JSON.parse(savedData) : JSON.parse(JSON.stringify(defaultData));
            
            if(localStorage.getItem('theme') === 'light') toggleTheme(true);
            const savedColor = localStorage.getItem('primaryColor');
            if(savedColor) {
                document.documentElement.style.setProperty('--primary', savedColor);
                document.getElementById('themeColorPicker').value = savedColor;
            }

            updateDateTimeAndGreeting();
            setInterval(updateDateTimeAndGreeting, 1000);
            fetchDhakaWeather();
            
            renderHome();
            renderSidebar();
            renderContent();
            openHome();
        }

        function saveData() {
            localStorage.setItem('studyDashboardData_v6', JSON.stringify(dbData));
            renderHome(); renderSidebar(); renderContent();
        }

        function renderIcon(val) {
            if(val.match(/\.(jpeg|jpg|gif|png|svg)$/i) || val.startsWith('http') || val.startsWith('data:image')) {
                return `<img src="${val}" alt="icon" onerror="this.outerHTML='📁'">`;
            }
            return val;
        }

        function openHome() {
            document.getElementById('homeView').style.display = 'flex';
            document.getElementById('dashboardView').style.display = 'none';
        }

        function openDashboard(sectionId) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'flex';
            switchTab(sectionId);
        }

        function renderHome() {
            const grid = document.getElementById('homeMenuGrid');
            grid.innerHTML = dbData.map(section => `
                <div class="home-menu-card" onclick="openDashboard('${section.id}')">
                    <div class="home-menu-icon">${renderIcon(section.icon)}</div>
                    ${section.title}
                </div>
            `).join('');
        }

        function renderSidebar() {
            const sidebar = document.getElementById('dynamicSidebar');
            sidebar.innerHTML = dbData.map(section => `
                <div class="nav-link" id="nav-${section.id}" onclick="switchTab('${section.id}')">
                    <div class="nav-icon">${renderIcon(section.icon)}</div> ${section.title}
                </div>
            `).join('');
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            dbData.forEach((section) => {
                const secHtml = document.createElement('div');
                secHtml.className = 'section';
                secHtml.id = `sec-${section.id}`;
                
                let linksHtml = section.links.map(link => `
                    <div class="card">
                        <a href="${link.url}" target="_blank" class="card-link" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
                            <div class="card-header"><div class="icon-box">${renderIcon(link.icon)}</div><h3>${link.title}</h3></div>
                            <p>${link.desc}</p>
                        </a>
                        <div class="edit-controls">
                            <button class="btn-small" onclick="openEditModal('${section.id}', '${link.id}')">Edit</button>
                            <button class="btn-small delete" onclick="deleteLink('${section.id}', '${link.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');

                secHtml.innerHTML = `
                    <div class="section-header-box">
                        <h2 class="section-title"><div class="nav-icon" style="width:36px; height:36px; font-size:28px;">${renderIcon(section.icon)}</div> ${section.title}</h2>
                        <div class="section-actions">
                            <button class="btn-small" onclick="openEditSectionModal('${section.id}')">✏️ Edit Menu</button>
                            <button class="btn-small delete" onclick="attemptDeleteSection('${section.id}')">🗑️ Delete Menu</button>
                        </div>
                    </div>
                    <div class="grid">
                        ${linksHtml}
                        <div class="add-card-btn" onclick="openAddModal('${section.id}')">+ Add New Link</div>
                    </div>
                `;
                container.appendChild(secHtml);
            });
        }

        function switchTab(id) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active-section'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            if(document.getElementById(`sec-${id}`)) {
                document.getElementById(`sec-${id}`).classList.add('active-section');
                document.getElementById(`nav-${id}`).classList.add('active');
            }
        }

        document.getElementById('toggleEditBtn').addEventListener('click', function() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('editing');
            this.classList.toggle('active-edit');
            document.getElementById('editIcon').innerText = isEditMode ? '💾' : '⚙️';
            document.getElementById('editText').innerText = isEditMode ? 'Exit Edit Mode' : 'Enable Edit Mode';
        });

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function openAddModal(secId) {
            document.getElementById('editId').value = ''; document.getElementById('editSectionId').value = secId;
            document.getElementById('linkForm').reset(); document.getElementById('modalTitle').innerText = 'Add New Link';
            document.getElementById('editModal').classList.add('active');
        }
        function openEditModal(secId, linkId) {
            const link = dbData.find(s => s.id === secId).links.find(l => l.id === linkId);
            document.getElementById('editId').value = link.id; document.getElementById('editSectionId').value = secId;
            document.getElementById('linkTitle').value = link.title; document.getElementById('linkUrl').value = link.url;
            document.getElementById('linkDesc').value = link.desc; document.getElementById('linkIcon').value = link.icon;
            document.getElementById('modalTitle').innerText = 'Edit Link'; document.getElementById('editModal').classList.add('active');
        }
        document.getElementById('linkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const secId = document.getElementById('editSectionId').value; const linkId = document.getElementById('editId').value;
            const newLink = { id: linkId || 'L' + Date.now(), title: document.getElementById('linkTitle').value, url: document.getElementById('linkUrl').value, desc: document.getElementById('linkDesc').value, icon: document.getElementById('linkIcon').value };
            const sec = dbData.find(s => s.id === secId);
            linkId ? sec.links[sec.links.findIndex(l => l.id === linkId)] = newLink : sec.links.push(newLink);
            saveData(); closeModal('editModal'); switchTab(secId);
        });
        
        function deleteLink(secId, linkId) {
            if(confirm('⚠️ ডিলিট করতে চান?')) { 
                const sec = dbData.find(s => s.id === secId); 
                sec.links = sec.links.filter(l => l.id !== linkId); 
                saveData(); switchTab(secId);
            }
        }

        function openSectionModal() { 
            document.getElementById('sectionForm').reset(); 
            document.getElementById('editSecId').value = '';
            document.getElementById('sectionModalTitle').innerText = 'Add New Menu';
            document.getElementById('sectionModal').classList.add('active'); 
        }
        function openEditSectionModal(secId) {
            const sec = dbData.find(s => s.id === secId);
            document.getElementById('editSecId').value = sec.id;
            document.getElementById('sectionTitle').value = sec.title;
            document.getElementById('sectionIcon').value = sec.icon;
            document.getElementById('sectionModalTitle').innerText = 'Edit Menu';
            document.getElementById('sectionModal').classList.add('active');
        }
        document.getElementById('sectionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const secId = document.getElementById('editSecId').value;
            if(secId) {
                const sec = dbData.find(s => s.id === secId);
                sec.title = document.getElementById('sectionTitle').value;
                sec.icon = document.getElementById('sectionIcon').value;
            } else {
                dbData.push({ id: 'sec_' + Date.now(), title: document.getElementById('sectionTitle').value, icon: document.getElementById('sectionIcon').value, links: [] });
            }
            saveData(); closeModal('sectionModal'); if(secId) switchTab(secId);
        });
        
        function attemptDeleteSection(secId) {
            const sec = dbData.find(s => s.id === secId);
            if(sec.links.length > 0) {
                alert('🛑 আগে এই মেনুর ভেতরের অপশনগুলো ডিলিট করুন।');
                return;
            }
            if(confirm(`⚠️ মেনু "${sec.title}" ডিলিট করতে চান?`)) {
                dbData = dbData.filter(s => s.id !== secId);
                saveData(); openHome();
            }
        }

        function exportUpdatedFile() {
            let htmlContent = document.documentElement.outerHTML;
            
            const currentDbString = JSON.stringify(dbData);
            htmlContent = htmlContent.replace(/const defaultData = \[[\s\S]*?\];/, `const defaultData = ${currentDbString};`);

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dashboard-updated.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('✅ আপনার ফাইলটি সফলভাবে ডাউনলোড হয়েছে! এখন থেকে এই নতুন ফাইলটি ওপেন করলেই আপনার সব এডিট করা ডাটা দেখতে পাবেন।');
        }

        function updateDateTimeAndGreeting() {
            const now = new Date();
            const hr = now.getHours();
            let greet = "Good Evening";
            if(hr >= 5 && hr < 12) greet = "Good Morning";
            else if(hr >= 12 && hr < 17) greet = "Good Afternoon";
            
            document.getElementById('dynamicGreeting').innerText = `${greet}, Arifin`;
            document.getElementById('homeTime').innerText = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute:'2-digit' });
            document.getElementById('homeDate').innerText = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        }

        async function fetchDhakaWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                let condition = "Clear ☀️";
                if(code >= 1 && code <= 3) condition = "Partly Cloudy ⛅";
                else if(code >= 51 && code <= 65) condition = "Rainy 🌧️";
                else if(code >= 95) condition = "Thunderstorm ⛈️";
                document.getElementById('homeWeather').innerText = `${temp}°C, ${condition}`;
            } catch(e) { document.getElementById('homeWeather').innerText = `Offline`; }
        }

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light-mode');
            document.getElementById('themeToggleBtn').innerText = isLight ? '🌙' : '☀️';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });
        function toggleTheme(forceLight) { if(forceLight) { document.body.classList.add('light-mode'); document.getElementById('themeToggleBtn').innerText = '🌙'; } }
        document.getElementById('themeColorPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--primary', e.target.value);
            localStorage.setItem('primaryColor', e.target.value);
        });

        initApp();
    </script>

</body></html>
